[project]
name = "so101-aimbot"
version = "0.1.0"
description = "SO-101 robotic arm playing Gridshot via perception → planning → control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_aimbot"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]
