[project]
name = "so101-aimbot"
version = "0.1.0"
description = "SO-101 robotic arm playing Gridshot via perception → planning → control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot[feetech]>=0.4.4",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0",
    "ruckig>=0.19.4",
    "numpy>=2.0,<2.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_aimbot"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pinocchio = ">=4.1.0,<5"

[tool.pixi.constraints]
numpy = ">=2.0,<2.3"

[tool.pixi.pypi-dependencies]
so101-aimbot = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.environments.dev]
features = ["dev"]
solve-group = "default"

[tool.pixi.environments.dev.tasks]
test = "pytest"

[tool.pixi.tasks]
main = "python main.py"
perception = "python scripts/run_perception.py"
